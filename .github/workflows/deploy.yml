name: Deploy Dream Vacation App 

on:
  workflow_dispatch:
  push:
    branches:
      - DreamAppEC2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update && sudo apt install -y jq docker-compose
            mkdir -p /home/ubuntu/dream-vacation
            cd /home/ubuntu/dream-vacation || exit 1

            docker-compose pull

            cat <<EOF > .env
            APP_ENV=DreamAppEC2
            DB_HOST=localhost
            DB_PORT=5432
            DB_USER=admin
            DB_PASSWORD=secret
            EOF

            docker-compose up -d --remove-orphans
          debug: true

