name: Deploy Dream Vacation App

on:
  push:
    branches:
      - DreamAppEC2

jobs:
  deploy:
    runs-on: ubuntu-latest



    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Sync files to EC2 with rsync
        uses: burnett01/rsync-deployments@5.0
        with:
          switches: -avz --delete 
          path: ./
          remote_path: /home/ubuntu/dream-vacation
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: SSH and deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update && sudo apt install -y jq 
            sudo systemctl enable docker
            sudo systemctl start docker
            mkdir -p /home/ubuntu/dream-vacation
            cd /home/ubuntu/dream-vacation || exit 1

            # FRONTEND_IMAGE_SHA=$(curl -s "https://hub.docker.com/v2/repositories/creatorobinnabyte/dream-vacation-frontend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')
            # BACKEND_IMAGE_SHA=$(curl -s "https://hub.docker.com/v2/repositories/creatorobinnabyte/dream-vacation-backend/tags?page_size=1&page=1&ordering=last_updated" | jq -r '.results[0].name')

            # Optional: create .env file
            cat <<EOF > .env
            FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_SHA}
            BACKEND_IMAGE_TAG=${BACKEND_IMAGE_SHA}
            APP_ENV=DreamAppEC2
            DB_HOST=localhost
            DB_PORT=5432
            DB_USER=admin
            DB_PASSWORD=secret
            EOF


            sudo docker compose pull
            sudo docker compose up -d --remove-orphans


