services:
  frontend:
    image: creatorobinnabyte/dream-vacation-app-frontend
    ports:
      - "80:80"  
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: creatorobinnabyte/dream-vacation-app-backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: vacation_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
