version: '3.8'

services:
  frontend:
   image:  creatorobinnabyte/dream-vacation-frontend:FRONTEND_IMAGE_SHA
    ports:
      - "3000:80"  
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: creatorobinnabyte/dream-vacation-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: vacation_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge 
